server {
    listen 80;
    server_name rem.softcelia.com;  # The domain to expose the application

    # Security Headers for better security
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # HSTS (use with HTTPS)
    add_header Content-Security-Policy "default-src 'self';" always;  # CSP header (adjust to your needs)
    add_header Referrer-Policy "no-referrer" always;

    # Caching Headers
    location / {
        root /usr/share/nginx/html;  # The directory where the built frontend app is located
        try_files $uri $uri/ =404;    # Return 404 if the file is not found

        # Cache static files for better performance (adjust expiry times as needed)
        location ~* \.(jpg|jpeg|png|gif|css|js|woff2|ttf|svg|ico|webp)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # Optionally, if you want to enable logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # If you're using a backend API, you might proxy the requests like this:
    # location /api/ {
    #     proxy_pass http://backend-api:3000;  # Replace with your backend server details
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

# Optionally, you can add a default server block to handle any undefined requests
server {
    listen 80 default_server;
    server_name _;

    return 444;  # Reject any request that doesn't match a valid server block
}
